# MongoDB binding defaults used by the experiment harness.
#
# experiment.sh passes one properties file to every YCSB invocation (the JDBC backends use
# jdbc-binding/conf/postgres.properties); this is the equivalent for the mongodb binding,
# which ships without a conf directory in this tree. The connection URI is NOT here: the
# runner passes -p mongodb.url=<uri> per phase, because each phase targets its own database.

db=site.ycsb.db.MongoDbClient
table=usertable

# One insert per call, i.e. what plain YCSB does; batching would hide per-operation latency.
batchsize=1
