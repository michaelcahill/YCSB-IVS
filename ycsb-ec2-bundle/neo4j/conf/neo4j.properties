# Neo4j binding defaults used by the experiment harness.
#
# experiment.sh passes one properties file to every YCSB invocation (the JDBC backends use
# jdbc-binding/conf/postgres.properties); this is the equivalent for the neo4j binding, which
# ships without a conf directory in this tree. The connection settings are NOT here: each of
# the three Neo4j instances is addressed per phase with -p url=…, -p username=…, -p password=…,
# because the main, reference and comparison databases are three separate instances.

table=usertable
