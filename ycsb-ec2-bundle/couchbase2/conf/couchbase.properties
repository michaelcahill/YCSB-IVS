# Couchbase (SDK 2.x) binding defaults used by the experiment harness.
#
# experiment.sh passes one properties file to every YCSB invocation (the JDBC backends use
# jdbc-binding/conf/postgres.properties); this is the equivalent for the couchbase2 binding,
# which ships without a conf directory in this tree. It deliberately assigns nothing:
#
#   * couchbase.host / couchbase.bucket / couchbase.password are passed per phase on the command
#     line (each phase targets its own bucket), and -p after -P would win anyway;
#   * couchbase.adhoc / couchbase.kv / couchbase.boost and the core insertion-retry settings are
#     appended by backend::extra_binding_params in lib/backends/couchbase.sh, so that a run's
#     actual command line is visible in the log instead of hidden in a properties file.
#
# Anything added here applies to every phase and can still be overridden by the runner.

db=site.ycsb.db.couchbase2.Couchbase2Client
table=usertable
